<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#333333">
  <meta name="description" content="Buscador Azteca: busca y descubre en español, gratis.">
  <title>Buscador Azteca — Búsqueda en español</title>
  <style>
    :root{color-scheme:light;--green:#28794b;--red:#b64336;--ink:#333;--blue:#1a0dab;--muted:#777;--line:#d9d9d9}
    *{box-sizing:border-box}
    html,body{min-height:100%;margin:0}
    body{min-height:100vh;background:#fff;color:var(--ink);font:13px Arial,Helvetica,sans-serif;display:flex;flex-direction:column}
    .flag{height:3px;background:linear-gradient(90deg,#176a3c 0 33.3%,#fff 33.3% 66.6%,#ae3731 66.6%)}
    header{height:30px;flex:none;padding:0 24px;display:flex;align-items:center;justify-content:space-between;background:linear-gradient(#555,#333);color:#eee;font-size:12px;box-shadow:0 1px 2px #0003}
    .nav{display:flex;align-items:center;gap:19px}.nav a{color:#eee;text-decoration:none}.nav a:hover{text-decoration:underline}.nav .selected{font-weight:bold;color:#fff}
    .nav-right{display:flex;align-items:center;gap:17px}.apps{font-size:16px;opacity:.8}.signin{border:1px solid #3079ed;border-radius:2px;background:linear-gradient(#4d90fe,#4787ed);padding:4px 11px;color:white;font-weight:bold;text-decoration:none;text-shadow:0 1px #2262a8}
    main{width:100%;max-width:760px;margin:0 auto;padding:clamp(95px,17vh,155px) 20px 36px;text-align:center;flex:1}
    .logo{margin:0 0 21px;font-size:clamp(48px,8vw,66px);font-weight:500;letter-spacing:-3.8px;line-height:1.04;white-space:nowrap;user-select:none;text-shadow:0 1px 0 #f5f5f5}
    .logo .blue{color:#4285f4}.logo .red{color:#ea4335}.logo .yellow{color:#fbbc05}.logo .green{color:#34a853}.logo .azteca{font-size:.77em;letter-spacing:-2px;color:#555}
    .tagline{margin:-12px 0 23px;color:#777;font-size:12px}
    form{height:38px;max-width:584px;margin:0 auto;display:flex;align-items:center;border:1px solid #b9b9b9;border-top-color:#a0a0a0;background:#fff;box-shadow:inset 0 1px 2px #0000001c;transition:border-color .15s,box-shadow .15s}
    form:hover{border-color:#888;box-shadow:inset 0 1px 2px #00000022}form:focus-within{border-color:#4d90fe;box-shadow:inset 0 1px 2px #00000020,0 0 0 1px #4d90fe}
    .magnify{width:38px;color:#777;font-size:21px;line-height:1}.query{height:100%;min-width:0;flex:1;border:0;outline:0;background:transparent;padding:0 6px;color:#222;font:16px Arial,Helvetica,sans-serif}.query::-webkit-search-cancel-button{cursor:pointer}
    .actions{display:flex;justify-content:center;gap:8px;margin:16px 0 18px}
    button{min-width:118px;height:29px;padding:0 12px;border:1px solid #dcdcdc;border-radius:2px;background:linear-gradient(#f5f5f5,#f1f1f1);color:#444;font:11px Arial,Helvetica,sans-serif;font-weight:bold;cursor:pointer}
    button:hover{border-color:#c6c6c6;background:linear-gradient(#f8f8f8,#e9e9e9);color:#222;box-shadow:0 1px 1px #00000012}button:focus-visible,.chip:focus-visible{outline:2px solid #4d90fe;outline-offset:2px}button:disabled{opacity:.65;cursor:wait}
    .suggestions{min-height:20px;color:#777;font-size:12px}.chip{min-width:0;height:auto;padding:0;border:0;background:none;color:#1a0dab;font:12px Arial,sans-serif;font-weight:normal;cursor:pointer;text-decoration:none}.chip:hover{text-decoration:underline;box-shadow:none;background:none;border:0}
    .ornament{width:96px;height:2px;margin:31px auto 0;background:linear-gradient(90deg,#176a3c 0 33.3%,#d8c8a4 33.3% 66.6%,#ae3731 66.6%)}
    #status{min-height:20px;margin:24px auto 8px;color:#777;text-align:left;max-width:600px;font-size:13px}.results{max-width:600px;margin:0 auto;text-align:left;display:grid;gap:19px}
    .result{padding:0 0 2px;animation:appear .2s ease both}.result small{display:block;color:#777;font-size:11px;margin:0 0 3px}.result a{color:var(--blue);font-size:18px;text-decoration:none}.result a:hover{text-decoration:underline}.result p{margin:5px 0 0;color:#444;font-size:13px;line-height:1.5}
    .loader{display:inline-block;width:12px;height:12px;border:2px solid #ddd;border-top-color:#4285f4;border-radius:50%;vertical-align:-2px;margin-right:7px;animation:spin .7s linear infinite}
    footer{flex:none;padding:12px 20px;background:#f2f2f2;border-top:1px solid #e4e4e4;color:#777;font-size:12px;line-height:1.7}
    .footer-inner{max-width:960px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:14px}.footer-links{display:flex;gap:18px}.footer-links a{color:#666;text-decoration:none}.footer-links a:hover{text-decoration:underline}.country{color:#777}
    @keyframes spin{to{transform:rotate(360deg)}}@keyframes appear{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
    @media(max-width:520px){header{padding:0 12px}.nav{gap:11px}.nav-right{gap:10px}.apps{display:none}.nav a{font-size:11px}main{padding-top:95px}.logo{letter-spacing:-2.7px}.logo .azteca{letter-spacing:-1.5px}.query{font-size:15px}.actions{gap:7px}button{min-width:108px;padding:0 8px}.results,#status{max-width:100%}.footer-inner{align-items:flex-start;flex-direction:column;gap:5px}.footer-links{gap:14px}}
  </style>
</head>
<body>
  <div class="flag" aria-hidden="true"></div>
  <header>
    <nav class="nav" aria-label="Navegación principal"><a class="selected" href="#">Azteca</a><a href="https://es.wikipedia.org/" target="_blank" rel="noopener noreferrer">Imágenes</a><a href="https://es.wikipedia.org/" target="_blank" rel="noopener noreferrer">Conocimiento</a></nav>
    <div class="nav-right"><span class="apps" aria-hidden="true">▦</span><a class="signin" href="#search-form">Iniciar búsqueda</a></div>
  </header>
  <main>
    <h1 class="logo" aria-label="Buscador Azteca"><span class="blue">B</span><span class="red">u</span><span class="yellow">s</span><span class="blue">c</span><span class="green">a</span><span class="red">d</span><span class="yellow">o</span><span class="blue">r</span> <span class="azteca">Azteca</span></h1>
    <p class="tagline">Búsqueda sencilla, conocimiento para todos</p>
    <form id="search-form" role="search">
      <span class="magnify" aria-hidden="true">⌕</span>
      <input class="query" id="query" type="search" aria-label="Buscar en Buscador Azteca" placeholder="Escribe lo que quieres encontrar" autocomplete="off" required>
    </form>
    <div class="actions"><button id="submit" type="submit" form="search-form">Buscar en Azteca</button><button id="lucky" type="button">Me siento curioso</button></div>
    <div class="suggestions">Búsquedas populares: <button class="chip" type="button">Cultura mexica</button> · <button class="chip" type="button">Lugares de México</button> · <button class="chip" type="button">Espacio</button></div>
    <div class="ornament" aria-hidden="true"></div>
    <p id="status" role="status" aria-live="polite"></p>
    <section class="results" id="results" aria-label="Resultados de búsqueda"></section>
  </main>
  <footer><div class="footer-inner"><span class="country">Hecho con orgullo en México</span><nav class="footer-links" aria-label="Enlaces del pie"><a href="https://es.wikipedia.org/" target="_blank" rel="noopener noreferrer">Resultados de Wikipedia</a><a href="#search-form">Buscar</a><span>Búsqueda gratuita · Sin cuenta</span></nav></div></footer>
  <script>
    const form=document.querySelector('#search-form');
    const input=document.querySelector('#query');
    const button=document.querySelector('#submit');
    const status=document.querySelector('#status');
    const results=document.querySelector('#results');

    document.querySelectorAll('.chip').forEach(chip=>chip.addEventListener('click',()=>{
      input.value=chip.textContent;
      form.requestSubmit();
    }));
    document.querySelector('#lucky').addEventListener('click',()=>{
      const topics=['Cultura mexica','Lugares de México','Espacio','Maravillas naturales de México','Historia de Tenochtitlan'];
      input.value=topics[Math.floor(Math.random()*topics.length)];
      form.requestSubmit();
    });

    form.addEventListener('submit',async event=>{
      event.preventDefault();
      const term=input.value.trim();
      if(!term)return;
      button.disabled=true;
      results.replaceChildren();
      status.innerHTML='<span class="loader" aria-hidden="true"></span>Buscando en Wikipedia…';
      try{
        const url=new URL('https://es.wikipedia.org/w/api.php');
        url.search=new URLSearchParams({action:'query',list:'search',srsearch:term,srlimit:'10',format:'json',origin:'*',utf8:'1'});
        const response=await fetch(url);
        if(!response.ok)throw new Error('No se pudo conectar con la búsqueda. Comprueba tu conexión e inténtalo de nuevo.');
        const data=await response.json();
        const items=data?.query?.search||[];
        if(!items.length){status.textContent='No encontramos resultados. Intenta con otras palabras.';return;}
        status.textContent=`Aproximadamente ${items.length} resultados para “${term}”`;
        const fragment=document.createDocumentFragment();
        items.forEach(item=>{
          const article=document.createElement('article');article.className='result';
          const label=document.createElement('small');label.textContent='es.wikipedia.org';
          const link=document.createElement('a');link.textContent=item.title;
          link.href=`https://es.wikipedia.org/wiki/${encodeURIComponent(item.title.replaceAll(' ','_'))}`;
          link.target='_blank';link.rel='noopener noreferrer';
          const excerpt=document.createElement('p');
          const parsed=new DOMParser().parseFromString(item.snippet||'','text/html');
          excerpt.textContent=parsed.body.textContent||'';
          article.append(label,link,excerpt);fragment.append(article);
        });
        results.append(fragment);
      }catch(error){status.textContent=error.message||'Ocurrió un error. Intenta de nuevo.';}
      finally{button.disabled=false;}
    });
  </script>
</body>
</html>
