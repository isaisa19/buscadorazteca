<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Buscador Azteca: busca y descubre en español, gratis.">
  <title>Buscador Azteca — Búsqueda en español</title>
  <style>
    :root{color-scheme:light;--green:#28794b;--red:#b64336;--ink:#333;--blue:#1a0dab;--muted:#777;--line:#d9d9d9}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:#fff;color:var(--ink);font:13px Arial,Helvetica,sans-serif;display:flex;flex-direction:column}
    .flag{height:4px;background:linear-gradient(90deg,#176a3c 0 33.3%,#fff 33.3% 66.6%,#ae3731 66.6%)}
    header{height:58px;padding:0 28px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #eee;color:#666}
    .brand-mini{font-weight:bold;font-size:14px;color:#555;text-decoration:none}.header-note{font-size:12px;color:#888}
    main{width:100%;max-width:760px;margin:0 auto;padding:clamp(74px,15vh,145px) 20px 30px;text-align:center;flex:1}
    .logo{margin:0 0 25px;font-size:clamp(43px,8vw,64px);font-weight:500;letter-spacing:-3.5px;line-height:1.08;color:#4285f4;text-shadow:0 1px 0 #f1f1f1;white-space:nowrap}
    .logo .az{color:#555}.logo .green{color:#28794b}.logo .red{color:#b64336}.logo .gold{color:#d39a2e}
    .motto{margin:-16px 0 25px;color:#888;font-size:12px;letter-spacing:.25px}
    form{height:44px;max-width:584px;margin:0 auto;display:flex;align-items:center;border:1px solid #d9d9d9;border-radius:2px;background:#fff;box-shadow:0 1px 2px #00000014;transition:border-color .15s,box-shadow .15s}
    form:hover,form:focus-within{border-color:#b9b9b9;box-shadow:0 2px 5px #00000020}
    .magnify{width:42px;color:#888;font-size:20px;line-height:1}
    .query{height:100%;min-width:0;flex:1;border:0;outline:0;background:transparent;padding:0 8px;color:#222;font:16px Arial,Helvetica,sans-serif}
    .query::-webkit-search-cancel-button{cursor:pointer}
    .actions{display:flex;justify-content:center;gap:10px;margin:20px 0 18px}
    button{min-width:116px;height:36px;padding:0 15px;border:1px solid #dcdcdc;border-radius:2px;background:linear-gradient(#fafafa,#f1f1f1);color:#555;font:13px Arial,Helvetica,sans-serif;font-weight:bold;cursor:pointer}
    button:hover{border-color:#c6c6c6;background:linear-gradient(#f8f8f8,#e9e9e9);color:#222;box-shadow:0 1px 1px #00000012}
    button:focus-visible,.chip:focus-visible{outline:2px solid #4285f4;outline-offset:2px}
    button:disabled{opacity:.65;cursor:wait}
    .suggestions{min-height:22px;color:#777;font-size:12px}.chip{padding:0;border:0;background:none;color:#1a0dab;font:12px Arial,sans-serif;cursor:pointer;text-decoration:none}.chip:hover{text-decoration:underline;box-shadow:none;background:none;border:0}
    .ornament{width:100px;height:3px;margin:36px auto 0;background:linear-gradient(90deg,#176a3c 0 33.3%,#d8c8a4 33.3% 66.6%,#ae3731 66.6%)}
    #status{min-height:20px;margin:25px auto 8px;color:#777;text-align:left;max-width:600px;font-size:13px}
    .results{max-width:600px;margin:0 auto;text-align:left;display:grid;gap:20px}
    .result{padding:0 0 2px;animation:appear .2s ease both}.result small{display:block;color:#777;font-size:11px;margin:0 0 3px}.result a{color:var(--blue);font-size:18px;text-decoration:none}.result a:hover{text-decoration:underline}.result p{margin:5px 0 0;color:#444;font-size:13px;line-height:1.5}.result mark{background:#fff2b2;color:inherit}
    .loader{display:inline-block;width:12px;height:12px;border:2px solid #ddd;border-top-color:#4285f4;border-radius:50%;vertical-align:-2px;margin-right:7px;animation:spin .7s linear infinite}
    footer{padding:16px 20px 20px;text-align:center;background:#f2f2f2;border-top:1px solid #e4e4e4;color:#777;font-size:12px;line-height:1.8}
    footer a{color:#666;text-decoration:none}footer a:hover{text-decoration:underline}.sep{padding:0 9px;color:#bbb}
    @keyframes spin{to{transform:rotate(360deg)}}@keyframes appear{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
    @media(max-width:520px){header{height:48px;padding:0 16px}.header-note{font-size:11px}main{padding-top:75px}.logo{letter-spacing:-2.5px}.query{font-size:15px}.actions{gap:7px}button{min-width:108px;padding:0 10px}.results,#status{max-width:100%}}
  </style>
</head>
<body>
  <div class="flag" aria-hidden="true"></div>
  <header><a class="brand-mini" href="#">Buscador Azteca</a><span class="header-note">Una ventana al conocimiento de México y el mundo</span></header>
  <main>
    <h1 class="logo" aria-label="Buscador Azteca"><span class="az">B</span><span class="green">u</span><span class="red">s</span><span class="gold">c</span><span class="az">a</span><span class="green">d</span><span class="red">o</span><span class="gold">r</span> <span class="green">Azteca</span></h1>
    <p class="motto">Búsqueda sencilla, conocimiento para todos</p>
    <form id="search-form" role="search">
      <span class="magnify" aria-hidden="true">⌕</span>
      <input class="query" id="query" type="search" aria-label="Buscar en Buscador Azteca" placeholder="Escribe lo que quieres encontrar" autocomplete="off" required>
    </form>
    <div class="actions"><button id="submit" type="submit" form="search-form">Buscar en Azteca</button><button id="lucky" type="button">Me siento curioso</button></div>
    <div class="suggestions">Búsquedas populares: <button class="chip" type="button">Cultura mexica</button> · <button class="chip" type="button">Lugares de México</button> · <button class="chip" type="button">Espacio</button></div>
    <div class="ornament" aria-hidden="true"></div>
    <p id="status" role="status" aria-live="polite"></p>
    <section class="results" id="results" aria-label="Resultados de búsqueda"></section>
  </main>
  <footer><span>Hecho con orgullo en México</span><span class="sep">|</span><a href="https://es.wikipedia.org/" target="_blank" rel="noopener noreferrer">Resultados de Wikipedia</a><span class="sep">|</span><span>Búsqueda gratuita · No requiere cuenta</span></footer>
  <script>
    const form=document.querySelector('#search-form');
    const input=document.querySelector('#query');
    const button=document.querySelector('#submit');
    const status=document.querySelector('#status');
    const results=document.querySelector('#results');

    document.querySelectorAll('.chip').forEach(chip=>chip.addEventListener('click',()=>{
      input.value=chip.textContent;
      form.requestSubmit();
    }));
    document.querySelector('#lucky').addEventListener('click',()=>{
      const topics=['Cultura mexica','Lugares de México','Espacio','Maravillas naturales de México','Historia de Tenochtitlan'];
      input.value=topics[Math.floor(Math.random()*topics.length)];
      form.requestSubmit();
    });

    form.addEventListener('submit',async event=>{
      event.preventDefault();
      const term=input.value.trim();
      if(!term)return;
      button.disabled=true;
      results.replaceChildren();
      status.innerHTML='<span class="loader" aria-hidden="true"></span>Buscando en Wikipedia…';
      try{
        const url=new URL('https://es.wikipedia.org/w/api.php');
        url.search=new URLSearchParams({action:'query',list:'search',srsearch:term,srlimit:'10',format:'json',origin:'*',utf8:'1'});
        const response=await fetch(url);
        if(!response.ok)throw new Error('No se pudo conectar con la búsqueda. Comprueba tu conexión e inténtalo de nuevo.');
        const data=await response.json();
        const items=data?.query?.search||[];
        if(!items.length){status.textContent='No encontramos resultados. Intenta con otras palabras.';return;}
        status.textContent=`Aproximadamente ${items.length} resultados para “${term}”`;
        const fragment=document.createDocumentFragment();
        items.forEach(item=>{
          const article=document.createElement('article');article.className='result';
          const label=document.createElement('small');label.textContent='es.wikipedia.org';
          const link=document.createElement('a');link.textContent=item.title;
          link.href=`https://es.wikipedia.org/wiki/${encodeURIComponent(item.title.replaceAll(' ','_'))}`;
          link.target='_blank';link.rel='noopener noreferrer';
          const excerpt=document.createElement('p');
          const parsed=new DOMParser().parseFromString(item.snippet||'','text/html');
          excerpt.textContent=parsed.body.textContent||'';
          article.append(label,link,excerpt);fragment.append(article);
        });
        results.append(fragment);
      }catch(error){status.textContent=error.message||'Ocurrió un error. Intenta de nuevo.';}
      finally{button.disabled=false;}
    });
  </script>
</body>
</html>
